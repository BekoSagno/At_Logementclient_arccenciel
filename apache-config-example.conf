# Configuration Apache pour Laravel AT Logement
# Ajoutez cette configuration dans votre fichier httpd-vhosts.conf ou créez un nouveau VirtualHost

<VirtualHost *:80>
    ServerName at-logement.local
    DocumentRoot "C:/Dev/Site Web AT Logement/at-immobilier/public"
    
    <Directory "C:/Dev/Site Web AT Logement/at-immobilier/public">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    
    # Logs
    ErrorLog "C:/Dev/Site Web AT Logement/at-immobilier/storage/logs/apache-error.log"
    CustomLog "C:/Dev/Site Web AT Logement/at-immobilier/storage/logs/apache-access.log" common
</VirtualHost>

# OU si vous voulez utiliser localhost directement, modifiez le DocumentRoot dans httpd.conf :
# DocumentRoot "C:/Dev/Site Web AT Logement/at-immobilier/public"
# <Directory "C:/Dev/Site Web AT Logement/at-immobilier/public">
#     AllowOverride All
#     Require all granted
# </Directory>





